function homePage(){app.innerHTML=`<div class="landing"><header><a class="wordmark" href="/" style="color:inherit;text-decoration:none"><span>⚽</span> SquadraFacile</a><div class="head-actions"><a class="btn ghost sm" href="#/accedi">Accedi</a><a class="btn sm" href="#/accedi">Area squadre</a></div></header><main><section class="hero"><div><div class="eyebrow">Per calcio a 5, 7 e 11</div><h1>La tua squadra.<br>Tutto sotto controllo.</h1><p>Rosa, allenamenti, partite, disponibilità e convocazioni in un solo posto. Meno messaggi nel gruppo, più tempo per il campo.</p><a class="btn" href="#/accedi">Accedi alla tua squadra →</a><a class="btn outline" href="#funzioni">Scopri le funzioni</a><p style="font-size:13px;margin-top:20px">Accesso squadre attivato dall’amministratore · Giocatori senza account</p></div><div class="mock"><div style="font-weight:800;font-size:19px">⚽ La tua squadra</div><div class="mock-row">📅 Prossima partita <b style="float:right">Venerdì</b></div><div class="mock-row">👥 Rosa <b style="float:right">18 giocatori</b></div><div class="mock-row">✅ Disponibilità <b style="float:right">12 confermati</b></div><div class="mock-row">📋 Convocazioni <b style="float:right">Pronte</b></div></div></section><section class="section" id="funzioni"><div class="eyebrow" style="color:#507b2d">Tutto quello che serve</div><h2>Una squadra organizzata, senza complicazioni</h2><div class="feature-grid">${[['👥','Rosa giocatori','Giocatori, ruoli e numeri sempre disponibili.'],['📅','Calendario','Partite e allenamenti in un unico calendario. Importazione dei campionati quando disponibile.'],['✅','Disponibilità','I giocatori rispondono tramite link personale, senza password.'],['📋','Convocazioni','Prepara i convocati e condividili su WhatsApp.'],['⚽','Risultati e statistiche','Registra partite, presenze e dati della stagione.'],['💶','Cassa squadra','Gestione di quote e spese prevista nei prossimi aggiornamenti.']].map(f=>`<article class="feature"><div class="emoji">${f[0]}</div><h3>${f[1]}</h3><p>${f[2]}</p></article>`).join('')}</div></section><section class="section"><h2>Come funziona</h2><div class="steps">${[['1','Crea la squadra','Scegli calcio a 5, 7 o 11 e aggiungi la rosa.'],['2','Organizza gli impegni','Crea una partita e condividi i link di disponibilità.'],['3','Gestisci le convocazioni','Vedi chi è disponibile e prepara la lista.']].map(x=>`<div class="step"><span class="num">${x[0]}</span><strong>${x[1]}</strong><p class="muted">${x[2]}</p></div>`).join('')}</div></section><section class="section" id="prezzi"><h2 style="text-align:center">Un prezzo semplice, per tutta la squadra</h2><div class="price"><div class="eyebrow" style="color:#507b2d">SquadraFacile Premium</div><div style="margin:15px 0"><span class="amount">4,99 €</span><span class="muted"> / mese</span></div><p class="muted">Per squadra, non per giocatore.<br>14 giorni di prova gratuita.</p><a href="#/accedi" class="btn" style="display:block;text-decoration:none;margin-top:20px">Accedi all’area squadre →</a><p class="note">Le funzioni Premium e i pagamenti saranno attivati al lancio commerciale.</p></div></section></main><footer>© SquadraFacile · <a href="#/accedi">Area squadre</a> · <a href="#/admin">Accesso ADMIN</a></footer></div>`}

let adminTab='overview',adminData=null;

 try{let session=await get('/api/admin/session');if(session.isAdmin){adminData=await get('/api/admin');return renderAdmin()}}catch(e){toast(e.message)}
 app.innerHTML=`<div class="auth"><a class="auth-back" href="#/">← Home</a><div class="brand"><span class="logo">⚽</span> SquadraFacile</div><div class="card"><h2>Accesso ADMIN</h2><p class="muted">Credenziali amministratore configurate su Cloudflare.</p><form id="adminLogin" class="form"><div><label>Email ADMIN</label><input type="email" name="email" required autocomplete="username"></div><div><label>Password ADMIN</label><input type="password" name="password" required autocomplete="current-password"></div><button class="btn">Accedi al centro di controllo</button></form></div></div>`;

}

 if(adminTab==='overview')content=`<div class="grid">${[['Squadre',d.stats.teams],['Account',d.stats.users],['Giocatori',d.stats.players],['Eventi',d.stats.events],['Squadre attive',d.teams.filter(t=>!t.disabled).length],['Abbonamenti attivi (manuali)',d.teams.filter(t=>t.subscription?.status==='active').length]].map(([n,v])=>`<div class="card"><div class="muted">${n}</div><div class="stat">${v}</div></div>`).join('')}</div><div class="card"><h2>Ultime squadre</h2>${d.teams.slice(0,8).map(t=>`<div class="item"><div><strong>${esc(t.name)}</strong><div class="small muted">Calcio a ${Number(t.format)} · ${Number(t.players)} giocatori</div></div><button class="btn ghost sm" data-detail="${esc(t.id)}">Dettagli</button></div>`).join('')||'<p class="muted">Nessuna squadra registrata.</p>'}</div>`;
 if(adminTab==='teams')content=`<div class="card"><div class="section-head"><h2>Squadre registrate (${d.teams.length})</h2><button class="btn sm" id="newAdminTeam">+ Nuova squadra</button></div><div id="createTeamPanel" style="display:none" class="create-team-panel"><h2>Nuova squadra</h2><p class="muted small">Crea la squadra e il suo account in un solo passaggio. L'email e la password saranno usate per accedere all'area riservata.</p><form id="adminCreateForm" class="form two"><div class="full"><label>Nome squadra</label><input name="name" placeholder="Es. Atletico Mesoraca" maxlength="100" required autofocus></div><div><label>Tipo di calcio</label><select name="format" required><option value="11">Calcio a 11</option><option value="7">Calcio a 7</option><option value="5">Calcio a 5</option></select></div><div><label>Abbonamento iniziale</label><select name="plan"><option value="trial">Prova gratuita — 14 giorni</option><option value="monthly">Mensile — 30 giorni (manuale)</option><option value="annual">Annuale — 365 giorni (manuale)</option></select></div><div><label>Email responsabile</label><input name="email" type="email" autocomplete="off" placeholder="responsabile@esempio.it" maxlength="254" required></div><div><label>Password iniziale (min. 10 caratteri)</label><div class="password-line"><input id="teamPassword" name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required><button class="btn ghost sm" type="button" id="showTeamPassword">Mostra</button></div></div><div class="full" id="createTeamError" role="alert" style="display:none"></div><div class="full actions"><button class="btn" id="createTeamSubmit" type="submit">Crea squadra e account</button><button class="btn ghost" type="button" id="cancelTeamCreate">Annulla</button></div></form></div><div class="section-head"><label for="adminSearch">Cerca squadra</label><input id="adminSearch" placeholder="Nome squadra o email" style="max-width:280px"></div><div id="adminList">${adminTeamRows(d.teams)}</div></div>`;
 if(adminTab==='users')content=`<div class="card"><div class="section-head"><h2>Account (${d.users.length})</h2><input id="adminSearch" placeholder="Cerca email" style="max-width:260px"></div><div id="adminList">${adminUserRows(d.users)}</div></div>`;
 if(adminTab==='payments')content=`<div class="card"><h2>Abbonamenti delle squadre</h2><p class="muted">Gestione manuale di piano, stato e scadenza. Nessun pagamento viene incassato automaticamente: Stripe non è collegato.</p>${d.teams.map(t=>`<div class="item"><div><strong>${esc(t.name)}</strong><div class="small muted">${esc(t.subscription?.plan||'non impostato')} · ${esc(t.subscription?.status||'non impostato')} · Scadenza ${esc(t.subscription?.ends_at||'non impostata')}</div></div><button class="btn ghost sm" data-sub="${esc(t.id)}">Gestisci</button></div>`).join('')||'<p class="muted">Nessuna squadra.</p>'}</div>`;
 if(adminTab==='audit')content=`<div class="card"><h2>Registro interventi ADMIN</h2>${d.logs.length?d.logs.map(l=>`<div class="item"><div><strong>${esc(l.action)}</strong><div class="small muted">${esc(l.actor_email)} · ${esc(l.target)} · ${esc(l.created_at)}</div></div></div>`).join(''):'<p class="muted">Nessun intervento registrato.</p>'}</div>`;
 app.innerHTML=`<div class="shell"><aside class="side"><div class="brand"><span class="logo">⚽</span> SquadraFacile</div><p style="color:#b2e87c;font-weight:700">CENTRO ADMIN</p><nav class="nav">${tabs.map(([id,n])=>`<button data-admin-tab="${id}" class="${adminTab===id?'active':''}">${esc(n)}</button>`).join('')}</nav><p class="note" style="margin-top:25px"><a href="#/app" style="color:white">← Area squadra</a></p><a href="#/" style="color:#cbd5e1">Home pubblica</a></aside><main class="main"><div class="top"><div><h1>Centro di controllo</h1><p class="muted">Gestione piattaforma · Accesso amministratore</p></div><button class="btn ghost sm" id="adminRefresh">Aggiorna</button><button class="btn ghost sm" id="adminLogout">Esci ADMIN</button></div><div class="admin-tabs">${tabs.map(([id,n])=>`<button data-admin-tab="${id}" class="btn sm ${adminTab===id?'dark':'ghost'}">${esc(n)}</button>`).join('')}</div>${content}</main></div>`;
 document.querySelectorAll('[data-admin-tab]').forEach(x=>x.onclick=()=>{adminTab=x.dataset.adminTab;renderAdmin()});$('#adminLogout').onclick=()=>task(async()=>{await fetch('/api/admin/logout',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});adminData=null;location.hash='#/';homePage()});$('#adminRefresh').onclick=()=>task(async()=>{adminData=await get('/api/admin');renderAdmin();toast('Dati aggiornati')});
 if($('#newAdminTeam'))$('#newAdminTeam').onclick=()=>adminNewTeam();if($('#cancelTeamCreate'))$('#cancelTeamCreate').onclick=()=>{$('#createTeamPanel').style.display='none'};if($('#showTeamPassword'))$('#showTeamPassword').onclick=()=>{let p=$('#teamPassword');p.type=p.type==='password'?'text':'password';$('#showTeamPassword').textContent=p.type==='password'?'Mostra':'Nascondi'};if($('#adminCreateForm'))$('#adminCreateForm').onsubmit=submitAdminTeam;if($('#adminSearch'))$('#adminSearch').oninput=e=>{let q=e.target.value.toLowerCase();$('#adminList').innerHTML=adminTab==='teams'?adminTeamRows(d.teams.filter(t=>(t.name+' '+(t.owners||'')).toLowerCase().includes(q))):adminUserRows(d.users.filter(u=>u.email.toLowerCase().includes(q)));bindAdminRows()};bindAdminRows();

function adminTeamRows(rows){return rows.map(t=>`<div class="item"><div><strong>${esc(t.name)}</strong><div class="small muted">Calcio a ${Number(t.format)} · ${Number(t.players)} giocatori · ${Number(t.events)} eventi · ${esc(t.owners||'Nessun responsabile')} · ${t.disabled?'SOSPESA':'ATTIVA'} · ${esc(t.subscription?.status||'Piano non impostato')}</div></div><div><button class="btn ghost sm" data-detail="${esc(t.id)}">Gestisci</button> <button class="btn ghost sm" data-status="${esc(t.id)}" data-disabled="${t.disabled?1:0}">${t.disabled?'Riattiva':'Sospendi'}</button></div></div>`).join('')||'<p class="empty">Nessun risultato.</p>'}
function adminUserRows(rows){return rows.map(u=>`<div class="item"><div><strong>${esc(u.email)}</strong><div class="small muted">${Number(u.teams)} squadre · ${u.disabled?'ACCOUNT DISATTIVATO':'ATTIVO'} · Creato il ${esc(u.created_at)}</div></div><div><button class="btn ghost sm" data-email="${esc(u.id)}" data-current-email="${esc(u.email)}">Email</button> <button class="btn ghost sm" data-userstatus="${esc(u.id)}" data-disabled="${u.disabled?1:0}">${u.disabled?'Riattiva':'Disattiva'}</button> <button class="btn ghost sm" data-reset="${esc(u.id)}">Password</button> <button class="btn ghost sm" data-revoke="${esc(u.id)}">Revoca sessioni</button></div></div>`).join('')||'<p class="empty">Nessun risultato.</p>'}

async function submitAdminTeam(e){
 e.preventDefault();const form=e.currentTarget,submit=$('#createTeamSubmit'),error=$('#createTeamError'),f=new FormData(form);
 const name=String(f.get('name')||'').trim(),email=String(f.get('email')||'').trim(),password=String(f.get('password')||'');
 error.style.display='none';
 if(!name||password.length<10){error.textContent='Inserisci il nome e una password di almeno 10 caratteri.';error.style.display='block';return}
 submit.disabled=true;submit.textContent='Salvataggio in corso…';
 try{
  const r=await fetch('/api/admin',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'adminCreateTeam',name,email,password,format:Number(f.get('format')),plan:f.get('plan')})});
  const ct=r.headers.get('content-type')||'';const data=ct.includes('application/json')?await r.json():{error:'Il server non ha restituito JSON (HTTP '+r.status+').'};
  if(!r.ok||!data.ok||!data.team?.id)throw Error(data.error||'Creazione non confermata dal server');
  const refreshed=await get('/api/admin');
  if(!refreshed.teams.some(t=>t.id===data.team.id))throw Error('Account creato, ma la squadra non compare ancora nell’elenco. Aggiorna la pagina prima di riprovare.');
  adminData=refreshed;adminTab='teams';renderAdmin();toast('Squadra «'+name+'» creata e verificata nel database.');
 }catch(ex){error.textContent=ex.message;error.className='full alert error';error.style.display='block';toast('Impossibile creare la squadra: '+ex.message)}
 finally{submit.disabled=false;submit.textContent='Crea squadra e account'}
}
function adminSubscription(id){let t=adminData.teams.find(x=>x.id===id);if(!t)return;let s=t.subscription||{};let plan=prompt('Piano: trial, monthly, annual, custom',s.plan||'trial');if(plan===null)return;if(!['trial','monthly','annual','custom'].includes(plan))return toast('Piano non valido');let status=prompt('Stato: trial, active, past_due, expired, cancelled',s.status||'trial');if(status===null)return;if(!['trial','active','past_due','expired','cancelled'].includes(status))return toast('Stato non valido');let endsAt=prompt('Scadenza (AAAA-MM-GG, vuoto se assente)',(s.ends_at||'').slice(0,10));if(endsAt===null)return;let notes=prompt('Note interne',s.notes||'');if(notes===null)return;task(async()=>{await api('adminSubscription',{teamId:id,plan,status,endsAt,notes});adminData=await get('/api/admin');renderAdmin();toast('Abbonamento aggiornato')})}
function bindAdminRows(){document.querySelectorAll('[data-sub]').forEach(x=>x.onclick=()=>adminSubscription(x.dataset.sub));document.querySelectorAll('[data-email]').forEach(x=>x.onclick=()=>{let email=prompt('Nuova email account:',x.dataset.currentEmail);if(email)task(async()=>{await api('adminChangeEmail',{userId:x.dataset.email,email});adminData=await get('/api/admin');renderAdmin();toast('Email aggiornata: sessioni revocate')})});document.querySelectorAll('[data-userstatus]').forEach(x=>x.onclick=()=>{let disabled=x.dataset.disabled!=='1';if(confirm(disabled?'Disattivare account e disconnetterlo?':'Riattivare account?'))task(async()=>{await api('adminSetUserStatus',{userId:x.dataset.userstatus,disabled});adminData=await get('/api/admin');renderAdmin();toast('Account aggiornato')})});document.querySelectorAll('[data-reset]').forEach(x=>x.onclick=()=>{let password=prompt('Nuova password (almeno 10 caratteri):');if(password)task(async()=>{await api('adminResetPassword',{userId:x.dataset.reset,password});toast('Password aggiornata e sessioni revocate')})});document.querySelectorAll('[data-status]').forEach(x=>x.onclick=()=>{let disabled=x.dataset.disabled!=='1';if(confirm(disabled?'Sospendere questa squadra?':'Riattivare questa squadra?'))task(async()=>{await api('adminSetTeamStatus',{teamId:x.dataset.status,disabled});adminData=await get('/api/admin');renderAdmin()})});document.querySelectorAll('[data-detail]').forEach(x=>x.onclick=()=>task(async()=>{let d=await get('/api/admin/team?id='+encodeURIComponent(x.dataset.detail));let newName=prompt('Nome squadra (annulla per non modificare):',d.team.name);if(newName===null)return;if(!newName.trim())throw Error('Nome obbligatorio');await api('adminRenameTeam',{teamId:d.team.id,name:newName.trim()});adminData=await get('/api/admin');renderAdmin();toast('Squadra aggiornata')}));document.querySelectorAll('[data-revoke]').forEach(x=>x.onclick=()=>{if(confirm('Disconnettere questo account da tutti i dispositivi?'))task(async()=>{await api('adminRevokeSessions',{userId:x.dataset.revoke});adminData=await get('/api/admin');renderAdmin();toast('Sessioni revocate')})})}
function authScreen(register=false){app.innerHTML=`<div class="auth"><a class="auth-back" href="#/">← Torna alla home</a><div class="brand"><span class="logo">⚽</span> SquadraFacile</div><div class="card"><h2>Accedi all’area squadra</h2><p class="muted small">Per dirigenti e allenatori. I giocatori entrano tramite link personale.</p><form class="form" id="authform"><div><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div><label>Password</label><input name="password" type="password" autocomplete="${register?'new-password':'current-password'}" minlength="${register?10:1}" required></div><button class="btn">Accedi</button></form><p class="small muted">Le credenziali vengono fornite dall’amministratore.</p></div></div>`;$('#authform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);task(async()=>{await api('login',{email:f.get('email'),password:f.get('password')});await boot()})}}
function shell(content){let nav=[['home','🏠 Home'],['players','👥 Rosa'],['events','📅 Calendario'],['callups','📋 Convocazioni']];app.innerHTML=`<div class="shell"><aside class="side"><div class="brand"><span class="logo">⚽</span> SquadraFacile</div><nav class="nav">${nav.map(([id,t])=>`<button data-nav="${id}" class="${state.view===id?'active':''}">${t}</button>`).join('')}</nav><p class="note" style="margin-top:35px;color:#a7b6c8">Versione 2.0 · Gestione squadra</p></aside><main class="main"><header class="top"><div><h1>${esc(state.data?.team?.name||'SquadraFacile')}</h1><span class="muted small">Calcio a ${state.data?.team?.format||'?'} · ${esc(state.me?.email)}</span></div><div class="actions"><select id="teamSelect" aria-label="Seleziona squadra" style="max-width:180px">${state.teams.map(t=>`<option value="${esc(t.id)}" ${t.id===state.team?'selected':''}>${esc(t.name)}</option>`).join('')}</select><button class="btn ghost sm" id="logout">Esci</button></div></header>${content}</main></div><nav class="mobile-nav">${nav.map(([id,t])=>`<button data-nav="${id}" class="${state.view===id?'active':''}">${t}</button>`).join('')}</nav>`;document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>{state.view=x.dataset.nav;render()});$('#logout').onclick=()=>task(async()=>{await api('logout');state.me=null;state.data=null;location.hash='#/';homePage()});$('#teamSelect').onchange=e=>task(async()=>{state.team=e.target.value;await load()})}
function chooseTeam(){app.innerHTML=`<div class="auth"><div class="brand"><span class="logo">⚽</span> SquadraFacile</div><div class="card"><h2>Crea la tua prima squadra</h2><form id="create" class="form"><div><label>Nome squadra</label><input name="name" maxlength="100" required placeholder="Es. Atletico Mesoraca"></div><div><label>Formato</label><select name="format"><option value="5">Calcio a 5</option><option value="7">Calcio a 7</option><option value="11">Calcio a 11</option></select></div><button class="btn">Crea squadra</button></form><button class="btn ghost sm" id="out" style="margin-top:16px">Esci</button></div></div>`;$('#create').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);task(async()=>{let r=await api('createTeam',{name:f.get('name'),format:Number(f.get('format'))});state.team=r.id;await boot()})};$('#out').onclick=()=>task(async()=>{await api('logout');state.me=null;state.data=null;location.hash='#/';homePage()})}
async function boot(){if(state.playerToken)return playerPage();try{let r=await get('/api/me');state.me=r.user;state.isAdmin=!!r.isAdmin;state.teams=r.teams||[];if(!r.user)return route();if(location.hash==='#/admin')return adminAccess();if(!r.teams.length){app.innerHTML='<div class="auth"><div class="card"><h2>Nessuna squadra assegnata</h2><p>Contatta l’amministratore.</p><a href="#/">Home</a></div></div>';return}if(!state.team||!r.teams.some(t=>t.id===state.team))state.team=r.teams[0].id;await load();if(location.hash==='#/accedi'||location.hash==='#/registrati')location.hash='#/app'}catch(e){app.innerHTML=`<div class="auth"><div class="alert"><strong>Configurazione necessaria</strong><p>${esc(e.message)}</p><p class="small">Verifica il binding D1 <b>DB</b> e applica <b>schema.sql</b> al database remoto.</p></div></div>`}}
async function load(){state.data=await get('/api/team?id='+encodeURIComponent(state.team));render()}
function render(){if(!state.data)return;let d=state.data;let future=d.events.filter(e=>new Date(e.starts_at)>=new Date()).sort((a,b)=>a.starts_at.localeCompare(b.starts_at));let page='';if(state.view==='home')page=`<div class="grid"><div class="card"><span class="muted">Giocatori</span><div class="stat">${d.players.length}</div></div><div class="card"><span class="muted">Eventi registrati</span><div class="stat">${d.events.length}</div></div><div class="card"><span class="muted">Prossimi impegni</span><div class="stat">${future.length}</div></div></div><div class="card"><div class="section-head"><h2>Prossimi impegni</h2><button class="btn sm" data-go="events">Nuovo evento</button></div>${future.length?future.slice(0,6).map(e=>eventRow(e)).join(''):'<div class="empty">Nessun evento in programma. Crea una partita o un allenamento.</div>'}</div><div class="card"><h2>Inizia da qui</h2><p class="muted">1. Aggiungi i giocatori. 2. Crea una partita. 3. Genera un link personale per ciascun giocatore. 4. Raccogli le disponibilità e prepara le convocazioni.</p></div>`;
if(state.view==='players')page=`<div class="card"><h2>Aggiungi giocatore</h2><form class="form two" id="playerForm"><div><label>Nome e cognome</label><input name="name" maxlength="100" required></div><div><label>Numero maglia</label><input name="number" type="number" min="0" max="99"></div><div><label>Ruolo</label><select name="role"><option value="">Non specificato</option><option>Portiere</option><option>Difensore</option><option>Centrocampista</option><option>Attaccante</option><option>Pivot</option><option>Laterale</option></select></div><div style="align-self:end"><button class="btn">Aggiungi</button></div></form></div><div class="card"><h2>Rosa (${d.players.length})</h2>${d.players.length?d.players.map(p=>`<div class="item"><div><strong>${esc(p.name)}</strong> <span class="pill gray">#${p.number??'—'}</span><div class="small muted">${esc(p.role||'Ruolo non impostato')}</div></div><div class="actions"><button class="btn ghost sm" data-link="${p.id}">Genera link</button><button class="btn danger sm" data-delete-player="${p.id}">Elimina</button></div></div>`).join(''):'<div class="empty">Nessun giocatore inserito.</div>'}</div>`;
if(state.view==='events')page=`<div class="card"><h2>Nuovo evento</h2><form class="form two" id="eventForm"><div><label>Tipo</label><select name="type"><option value="match">Partita</option><option value="training">Allenamento</option><option value="other">Altro</option></select></div><div><label>Titolo</label><input name="title" required maxlength="120" placeholder="Es. 3ª giornata"></div><div><label>Data e ora</label><input name="startsAt" type="datetime-local" required></div><div><label>Campo / luogo</label><input name="venue" maxlength="120"></div><div><label>Avversario (facoltativo)</label><input name="opponent" maxlength="120"></div><div style="align-self:end"><button class="btn">Salva evento</button></div></form></div><div class="card"><h2>Calendario squadra</h2><div class="alert small">L'importazione dei calendari ufficiali LND non è ancora attiva in questa versione. Gli eventi qui vengono salvati nel database D1.</div>${d.events.length?d.events.slice().sort((a,b)=>b.starts_at.localeCompare(a.starts_at)).map(e=>eventRow(e,true)).join(''):'<div class="empty">Nessun evento.</div>'}</div>`;
if(state.view==='callups'){let selected=d.events.find(e=>e.id===state.eventId)||d.events[0];if(selected)state.eventId=selected.id;page=`<div class="card"><h2>Convocazioni</h2>${d.events.length?`<label>Seleziona partita o evento</label><select id="eventPick">${d.events.map(e=>`<option value="${e.id}" ${e.id===state.eventId?'selected':''}>${esc(e.title)} · ${esc(date(e.starts_at))}</option>`).join('')}</select>`:'<div class="empty">Crea prima un evento nel calendario.</div>'}</div>`;if(selected)page+=`<div class="card"><div class="section-head"><h2>${esc(selected.title)}</h2><button class="btn ghost sm" id="shareCallups">Condividi</button></div><p class="muted small">${esc(date(selected.starts_at))} · ${esc(selected.venue||'Campo da definire')}</p>${d.players.map(p=>{let c=d.callups.find(x=>x.event_id===selected.id&&x.player_id===p.id)?.status||'none',a=d.responses.find(x=>x.event_id===selected.id&&x.player_id===p.id)?.status;return `<div class="item"><div><strong>${esc(p.name)}</strong><div class="small muted">Disponibilità: ${a==='yes'?'Presente':a==='no'?'Assente':a==='maybe'?'In forse':'Non risposta'}</div></div><select data-callup="${p.id}" style="max-width:165px"><option value="none" ${c==='none'?'selected':''}>Non convocato</option><option value="called" ${c==='called'?'selected':''}>Convocato</option><option value="reserve" ${c==='reserve'?'selected':''}>Riserva</option></select></div>`}).join('')||'<div class="empty">Aggiungi giocatori alla rosa.</div>'}</div>`}
shell(page);document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{state.view=x.dataset.go;render()});document.querySelectorAll('[data-delete-player]').forEach(x=>x.onclick=()=>{if(confirm('Eliminare il giocatore e tutte le sue risposte?'))task(async()=>{await api('deletePlayer',{teamId:state.team,playerId:x.dataset.deletePlayer});await load()})});document.querySelectorAll('[data-delete-event]').forEach(x=>x.onclick=()=>{if(confirm('Eliminare questo evento e tutte le convocazioni?'))task(async()=>{await api('deleteEvent',{teamId:state.team,eventId:x.dataset.deleteEvent});await load()})});document.querySelectorAll('[data-link]').forEach(x=>x.onclick=()=>task(async()=>{let r=await api('playerLink',{teamId:state.team,playerId:x.dataset.link});try{await navigator.clipboard.writeText(r.url);toast('Link personale copiato! Il precedente link è revocato.')}catch{prompt('Copia il link personale:',r.url)}}));if($('#playerForm'))$('#playerForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);task(async()=>{await api('addPlayer',{teamId:state.team,name:f.get('name'),number:f.get('number'),role:f.get('role')});await load();toast('Giocatore aggiunto')})};if($('#eventForm'))$('#eventForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);task(async()=>{await api('addEvent',{teamId:state.team,type:f.get('type'),title:f.get('title'),startsAt:f.get('startsAt'),venue:f.get('venue'),opponent:f.get('opponent')});await load();toast('Evento creato')})};if($('#eventPick'))$('#eventPick').onchange=e=>{state.eventId=e.target.value;render()};document.querySelectorAll('[data-callup]').forEach(x=>x.onchange=()=>task(async()=>{await api('setCallup',{teamId:state.team,eventId:state.eventId,playerId:x.dataset.callup,status:x.value});await load();toast('Convocazione aggiornata')}));if($('#shareCallups'))$('#shareCallups').onclick=()=>{let e=d.events.find(x=>x.id===state.eventId),names=d.callups.filter(x=>x.event_id===e.id&&x.status==='called').map(x=>d.players.find(p=>p.id===x.player_id)?.name).filter(Boolean);let text=`Convocazioni ${d.team.name}\n${e.title} · ${date(e.starts_at)}\n${e.venue||''}\n\n${names.join('\n')||'Nessun convocato'}`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener')}}
function eventRow(e,del=false){let answers=state.data.responses.filter(a=>a.event_id===e.id);return `<div class="item"><div><strong>${esc(e.title)}</strong> <span class="pill">${e.type==='match'?'Partita':e.type==='training'?'Allenamento':'Altro'}</span><div class="muted small">${esc(date(e.starts_at))} · ${esc(e.venue||'Luogo da definire')}${e.opponent?' · vs '+esc(e.opponent):''}</div><div class="small muted">Disponibilità: ${answers.filter(a=>a.status==='yes').length} presenti · ${answers.filter(a=>a.status==='no').length} assenti · ${answers.filter(a=>a.status==='maybe').length} in forse</div></div>${del?`<button class="btn danger sm" data-delete-event="${e.id}">Elimina</button>`:''}</div>`}
async function playerPage(){let t=state.playerToken;try{let d=await get('/api/player?token='+encodeURIComponent(t));app.innerHTML=`<div class="player"><div class="brand" style="color:#14263e"><span class="logo">⚽</span> SquadraFacile</div><div class="card"><h1>Ciao, ${esc(d.player.name)}!</h1><p class="muted">${esc(d.player.team_name)} · La tua disponibilità</p></div>${d.events.length?d.events.map(e=>`<div class="card"><h2>${esc(e.title)}</h2><p class="muted small">${esc(date(e.starts_at))} · ${esc(e.venue||'Campo da definire')}</p>${e.opponent?`<p class="small">Avversario: ${esc(e.opponent)}</p>`:''}<div class="status">${[['yes','Ci sono'],['maybe','In forse'],['no','Non ci sono']].map(([v,l])=>`<button data-response="${e.id}" data-status="${v}" class="${e.my_status===v?'selected':''}">${l}</button>`).join('')}</div>${e.callup?`<p class="pill" style="margin-top:14px">${e.callup==='called'?'Sei convocato':'Sei riserva'}</p>`:''}</div>`).join(''):'<div class="card empty">Nessun impegno in programma.</div>'}<p class="note">Questo link è personale: non condividerlo con altre persone.</p></div>`;document.querySelectorAll('[data-response]').forEach(x=>x.onclick=()=>task(async()=>{await api('availability',{token:t,eventId:x.dataset.response,status:x.dataset.status});toast('Disponibilità salvata');await playerPage()}))}catch(e){app.innerHTML=`<div class="auth"><div class="alert">${esc(e.message)}. Chiedi al dirigente un nuovo link.</div></div>`}}
window.addEventListener('hashchange',()=>{if(state.me&&state.data&&location.hash==='#/app')render();else route()});boot();
</script></body></html>
