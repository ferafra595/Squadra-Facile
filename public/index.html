<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c30"><meta name="description" content="SquadraFacile: gestisci rosa, calendario, disponibilità e convocazioni della tua squadra."><link rel="manifest" href="/manifest.webmanifest"><title>SquadraFacile</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#16243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.shell{min-height:100vh;display:flex}.side{width:235px;background:#101c30;color:#fff;padding:25px 15px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{display:flex;gap:10px;align-items:center;font-size:22px;font-weight:800;margin-bottom:35px}.logo{background:#b2e87c;color:#101c30;border-radius:12px;padding:10px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:13px;border-radius:11px}.nav button.active,.nav button:hover{background:#283b55;color:white}.main{flex:1;min-width:0;padding:28px;max-width:1150px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.muted{color:#64748b}.small{font-size:13px}h1{font-size:27px;margin:0 0 6px}h2{font-size:19px;margin:0 0 16px}.card{background:white;border:1px solid #e1e8f0;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 3px 15px #182a4006}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{font-size:29px;font-weight:800;margin:8px 0}.btn{border:0;background:#a9e46f;color:#172a20;padding:12px 16px;border-radius:10px;font-weight:750}.btn.dark{background:#14263e;color:white}.btn.ghost{background:#eaf0f7;color:#263b55}.btn.danger{background:#ffe7e7;color:#9c2323}.btn.sm{padding:7px 10px;font-size:13px}.btn+ .btn{margin-left:5px}input,select{width:100%;padding:12px;border:1px solid #d6dfe9;border-radius:10px;background:white;color:#18273d}label{display:block;font-weight:650;font-size:13px;margin:0 0 6px}.form{display:grid;gap:14px}.form.two{grid-template-columns:repeat(2,minmax(0,1fr))}.form .full{grid-column:1/-1}.list{display:grid;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eef1f6}.item:last-child{border-bottom:0}.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.pill{display:inline-block;background:#eaf4e2;border-radius:100px;padding:4px 9px;font-size:12px;color:#336b23}.pill.gray{background:#e9eef5;color:#536174}.alert{background:#fff5dc;border:1px solid #f3d79c;padding:12px 15px;border-radius:12px;margin-bottom:18px}.error{color:#ad2828}.success{color:#257042}.auth{max-width:430px;margin:10vh auto;padding:10px}.auth .brand{color:#15263d;justify-content:center}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tabs button{border:0;border-radius:10px;padding:9px 13px;background:#e8eef5;color:#1a314d}.tabs button.active{background:#14263e;color:#fff}.mobile-nav{display:none}.empty{color:#738299;padding:18px;text-align:center}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}a{color:#24618c;text-decoration:none}a:hover{text-decoration:underline}#toast{position:fixed;right:20px;bottom:20px;background:#172b43;color:white;padding:13px 18px;border-radius:12px;display:none;max-width:360px;z-index:50}.player{max-width:650px;margin:35px auto;padding:0 16px}.status{display:flex;gap:7px;flex-wrap:wrap}.status button{border:1px solid #d7e0eb;background:#fff;padding:9px;border-radius:9px}.status button.selected{background:#ccecae;border-color:#73ad48}.note{font-size:12px;color:#6e7d90} @media(max-width:780px){.side{display:none}.main{padding:18px 15px 92px}.grid,.grid.two{grid-template-columns:1fr}.form.two{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#101c30;justify-content:space-around;padding:10px 3px calc(10px + env(safe-area-inset-bottom));z-index:30}.mobile-nav button{border:0;background:none;color:#e0e8f1;font-size:11px;padding:8px 5px}.mobile-nav button.active{color:#b2e87c}.card{padding:17px}.top{align-items:flex-start}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}}
</style></head><body><div id="app"></div><div id="toast" role="status"></div><script>
const $=s=>document.querySelector(s),app=$('#app');let state={me:null,teams:[],team:null,data:null,view:'home',eventId:null,playerToken:new URLSearchParams(location.search).get('player')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s).toLocaleString('it-IT',{dateStyle:'medium',timeStyle:'short'}):'—';
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',4000)}
async function api(op,data={}){let r=await fetch('/api/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,...data}),credentials:'same-origin'}),j=await r.json().catch(()=>({error:'Risposta non valida'}));if(!r.ok)throw Error(j.error||'Errore');return j}
async function get(path){let r=await fetch(path,{credentials:'same-origin'}),j=await r.json().catch(()=>({error:'Risposta non valida'}));if(!r.ok)throw Error(j.error||'Errore');return j}
async function task(fn){try{await fn()}catch(e){toast(e.message)}}
function authScreen(register=false){app.innerHTML=`<div class="auth"><div class="brand"><span class="logo">⚽</span> SquadraFacile</div><div class="card"><h2>${register?'Crea il tuo account':'Accedi al gestionale'}</h2><p class="muted small">Per dirigenti e allenatori. I giocatori entrano tramite link personale.</p><form class="form" id="authform"><div><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div><label>Password</label><input name="password" type="password" autocomplete="${register?'new-password':'current-password'}" minlength="${register?10:1}" required></div><button class="btn">${register?'Registrati':'Accedi'}</button></form><p class="small muted">${register?'Hai già un account?':'Non hai un account?'} <a href="#" id="swap">${register?'Accedi':'Registrati'}</a></p></div></div>`;$('#swap').onclick=e=>{e.preventDefault();authScreen(!register)};$('#authform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);task(async()=>{await api(register?'register':'login',{email:f.get('email'),password:f.get('password')});await boot()})}}
function shell(content){let nav=[['home','🏠 Home'],['players','👥 Rosa'],['events','📅 Calendario'],['callups','📋 Convocazioni']];app.innerHTML=`<div class="shell"><aside class="side"><div class="brand"><span class="logo">⚽</span> SquadraFacile</div><nav class="nav">${nav.map(([id,t])=>`<button data-nav="${id}" class="${state.view===id?'active':''}">${t}</button>`).join('')}</nav><p class="note" style="margin-top:35px;color:#a7b6c8">Versione 2.0 · Gestione squadra</p></aside><main class="main"><header class="top"><div><h1>${esc(state.data?.team?.name||'SquadraFacile')}</h1><span class="muted small">Calcio a ${state.data?.team?.format||'?'} · ${esc(state.me?.email)}</span></div><div class="actions"><select id="teamSelect" aria-label="Seleziona squadra" style="max-width:180px">${state.teams.map(t=>`<option value="${esc(t.id)}" ${t.id===state.team?'selected':''}>${esc(t.name)}</option>`).join('')}</select><button class="btn ghost sm" id="logout">Esci</button></div></header>${content}</main></div><nav class="mobile-nav">${nav.map(([id,t])=>`<button data-nav="${id}" class="${state.view===id?'active':''}">${t}</button>`).join('')}</nav>`;document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>{state.view=x.dataset.nav;render()});$('#logout').onclick=()=>task(async()=>{await api('logout');state.me=null;authScreen()});$('#teamSelect').onchange=e=>task(async()=>{state.team=e.target.value;await load()})}
function chooseTeam(){app.innerHTML=`<div class="auth"><div class="brand"><span class="logo">⚽</span> SquadraFacile</div><div class="card"><h2>Crea la tua prima squadra</h2><form id="create" class="form"><div><label>Nome squadra</label><input name="name" maxlength="100" required placeholder="Es. Atletico Mesoraca"></div><div><label>Formato</label><select name="format"><option value="5">Calcio a 5</option><option value="7">Calcio a 7</option><option value="11">Calcio a 11</option></select></div><button class="btn">Crea squadra</button></form><button class="btn ghost sm" id="out" style="margin-top:16px">Esci</button></div></div>`;$('#create').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);task(async()=>{let r=await api('createTeam',{name:f.get('name'),format:Number(f.get('format'))});state.team=r.id;await boot()})};$('#out').onclick=()=>task(async()=>{await api('logout');authScreen()})}
async function boot(){if(state.playerToken)return playerPage();try{let r=await get('/api/me');state.me=r.user;state.teams=r.teams||[];if(!r.user)return authScreen();if(!r.teams.length)return chooseTeam();if(!state.team||!r.teams.some(t=>t.id===state.team))state.team=r.teams[0].id;await load()}catch(e){app.innerHTML=`<div class="auth"><div class="alert"><strong>Configurazione necessaria</strong><p>${esc(e.message)}</p><p class="small">Verifica il binding D1 <b>DB</b> e applica <b>schema.sql</b> al database remoto.</p></div></div>`}}
async function load(){state.data=await get('/api/team?id='+encodeURIComponent(state.team));render()}
function render(){if(!state.data)return;let d=state.data;let future=d.events.filter(e=>new Date(e.starts_at)>=new Date()).sort((a,b)=>a.starts_at.localeCompare(b.starts_at));let page='';if(state.view==='home')page=`<div class="grid"><div class="card"><span class="muted">Giocatori</span><div class="stat">${d.players.length}</div></div><div class="card"><span class="muted">Eventi registrati</span><div class="stat">${d.events.length}</div></div><div class="card"><span class="muted">Prossimi impegni</span><div class="stat">${future.length}</div></div></div><div class="card"><div class="section-head"><h2>Prossimi impegni</h2><button class="btn sm" data-go="events">Nuovo evento</button></div>${future.length?future.slice(0,6).map(e=>eventRow(e)).join(''):'<div class="empty">Nessun evento in programma. Crea una partita o un allenamento.</div>'}</div><div class="card"><h2>Inizia da qui</h2><p class="muted">1. Aggiungi i giocatori. 2. Crea una partita. 3. Genera un link personale per ciascun giocatore. 4. Raccogli le disponibilità e prepara le convocazioni.</p></div>`;
if(state.view==='players')page=`<div class="card"><h2>Aggiungi giocatore</h2><form class="form two" id="playerForm"><div><label>Nome e cognome</label><input name="name" maxlength="100" required></div><div><label>Numero maglia</label><input name="number" type="number" min="0" max="99"></div><div><label>Ruolo</label><select name="role"><option value="">Non specificato</option><option>Portiere</option><option>Difensore</option><option>Centrocampista</option><option>Attaccante</option><option>Pivot</option><option>Laterale</option></select></div><div style="align-self:end"><button class="btn">Aggiungi</button></div></form></div><div class="card"><h2>Rosa (${d.players.length})</h2>${d.players.length?d.players.map(p=>`<div class="item"><div><strong>${esc(p.name)}</strong> <span class="pill gray">#${p.number??'—'}</span><div class="small muted">${esc(p.role||'Ruolo non impostato')}</div></div><div class="actions"><button class="btn ghost sm" data-link="${p.id}">Genera link</button><button class="btn danger sm" data-delete-player="${p.id}">Elimina</button></div></div>`).join(''):'<div class="empty">Nessun giocatore inserito.</div>'}</div>`;
if(state.view==='events')page=`<div class="card"><h2>Nuovo evento</h2><form class="form two" id="eventForm"><div><label>Tipo</label><select name="type"><option value="match">Partita</option><option value="training">Allenamento</option><option value="other">Altro</option></select></div><div><label>Titolo</label><input name="title" required maxlength="120" placeholder="Es. 3ª giornata"></div><div><label>Data e ora</label><input name="startsAt" type="datetime-local" required></div><div><label>Campo / luogo</label><input name="venue" maxlength="120"></div><div><label>Avversario (facoltativo)</label><input name="opponent" maxlength="120"></div><div style="align-self:end"><button class="btn">Salva evento</button></div></form></div><div class="card"><h2>Calendario squadra</h2><div class="alert small">L'importazione dei calendari ufficiali LND non è ancora attiva in questa versione. Gli eventi qui vengono salvati nel database D1.</div>${d.events.length?d.events.slice().sort((a,b)=>b.starts_at.localeCompare(a.starts_at)).map(e=>eventRow(e,true)).join(''):'<div class="empty">Nessun evento.</div>'}</div>`;
if(state.view==='callups'){let selected=d.events.find(e=>e.id===state.eventId)||d.events[0];if(selected)state.eventId=selected.id;page=`<div class="card"><h2>Convocazioni</h2>${d.events.length?`<label>Seleziona partita o evento</label><select id="eventPick">${d.events.map(e=>`<option value="${e.id}" ${e.id===state.eventId?'selected':''}>${esc(e.title)} · ${esc(date(e.starts_at))}</option>`).join('')}</select>`:'<div class="empty">Crea prima un evento nel calendario.</div>'}</div>`;if(selected)page+=`<div class="card"><div class="section-head"><h2>${esc(selected.title)}</h2><button class="btn ghost sm" id="shareCallups">Condividi</button></div><p class="muted small">${esc(date(selected.starts_at))} · ${esc(selected.venue||'Campo da definire')}</p>${d.players.map(p=>{let c=d.callups.find(x=>x.event_id===selected.id&&x.player_id===p.id)?.status||'none',a=d.responses.find(x=>x.event_id===selected.id&&x.player_id===p.id)?.status;return `<div class="item"><div><strong>${esc(p.name)}</strong><div class="small muted">Disponibilità: ${a==='yes'?'Presente':a==='no'?'Assente':a==='maybe'?'In forse':'Non risposta'}</div></div><select data-callup="${p.id}" style="max-width:165px"><option value="none" ${c==='none'?'selected':''}>Non convocato</option><option value="called" ${c==='called'?'selected':''}>Convocato</option><option value="reserve" ${c==='reserve'?'selected':''}>Riserva</option></select></div>`}).join('')||'<div class="empty">Aggiungi giocatori alla rosa.</div>'}</div>`}
shell(page);document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{state.view=x.dataset.go;render()});document.querySelectorAll('[data-delete-player]').forEach(x=>x.onclick=()=>{if(confirm('Eliminare il giocatore e tutte le sue risposte?'))task(async()=>{await api('deletePlayer',{teamId:state.team,playerId:x.dataset.deletePlayer});await load()})});document.querySelectorAll('[data-delete-event]').forEach(x=>x.onclick=()=>{if(confirm('Eliminare questo evento e tutte le convocazioni?'))task(async()=>{await api('deleteEvent',{teamId:state.team,eventId:x.dataset.deleteEvent});await load()})});document.querySelectorAll('[data-link]').forEach(x=>x.onclick=()=>task(async()=>{let r=await api('playerLink',{teamId:state.team,playerId:x.dataset.link});try{await navigator.clipboard.writeText(r.url);toast('Link personale copiato! Il precedente link è revocato.')}catch{prompt('Copia il link personale:',r.url)}}));if($('#playerForm'))$('#playerForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);task(async()=>{await api('addPlayer',{teamId:state.team,name:f.get('name'),number:f.get('number'),role:f.get('role')});await load();toast('Giocatore aggiunto')})};if($('#eventForm'))$('#eventForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);task(async()=>{await api('addEvent',{teamId:state.team,type:f.get('type'),title:f.get('title'),startsAt:f.get('startsAt'),venue:f.get('venue'),opponent:f.get('opponent')});await load();toast('Evento creato')})};if($('#eventPick'))$('#eventPick').onchange=e=>{state.eventId=e.target.value;render()};document.querySelectorAll('[data-callup]').forEach(x=>x.onchange=()=>task(async()=>{await api('setCallup',{teamId:state.team,eventId:state.eventId,playerId:x.dataset.callup,status:x.value});await load();toast('Convocazione aggiornata')}));if($('#shareCallups'))$('#shareCallups').onclick=()=>{let e=d.events.find(x=>x.id===state.eventId),names=d.callups.filter(x=>x.event_id===e.id&&x.status==='called').map(x=>d.players.find(p=>p.id===x.player_id)?.name).filter(Boolean);let text=`Convocazioni ${d.team.name}\n${e.title} · ${date(e.starts_at)}\n${e.venue||''}\n\n${names.join('\n')||'Nessun convocato'}`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener')}}
function eventRow(e,del=false){let answers=state.data.responses.filter(a=>a.event_id===e.id);return `<div class="item"><div><strong>${esc(e.title)}</strong> <span class="pill">${e.type==='match'?'Partita':e.type==='training'?'Allenamento':'Altro'}</span><div class="muted small">${esc(date(e.starts_at))} · ${esc(e.venue||'Luogo da definire')}${e.opponent?' · vs '+esc(e.opponent):''}</div><div class="small muted">Disponibilità: ${answers.filter(a=>a.status==='yes').length} presenti · ${answers.filter(a=>a.status==='no').length} assenti · ${answers.filter(a=>a.status==='maybe').length} in forse</div></div>${del?`<button class="btn danger sm" data-delete-event="${e.id}">Elimina</button>`:''}</div>`}
async function playerPage(){let t=state.playerToken;try{let d=await get('/api/player?token='+encodeURIComponent(t));app.innerHTML=`<div class="player"><div class="brand" style="color:#14263e"><span class="logo">⚽</span> SquadraFacile</div><div class="card"><h1>Ciao, ${esc(d.player.name)}!</h1><p class="muted">${esc(d.player.team_name)} · La tua disponibilità</p></div>${d.events.length?d.events.map(e=>`<div class="card"><h2>${esc(e.title)}</h2><p class="muted small">${esc(date(e.starts_at))} · ${esc(e.venue||'Campo da definire')}</p>${e.opponent?`<p class="small">Avversario: ${esc(e.opponent)}</p>`:''}<div class="status">${[['yes','Ci sono'],['maybe','In forse'],['no','Non ci sono']].map(([v,l])=>`<button data-response="${e.id}" data-status="${v}" class="${e.my_status===v?'selected':''}">${l}</button>`).join('')}</div>${e.callup?`<p class="pill" style="margin-top:14px">${e.callup==='called'?'Sei convocato':'Sei riserva'}</p>`:''}</div>`).join(''):'<div class="card empty">Nessun impegno in programma.</div>'}<p class="note">Questo link è personale: non condividerlo con altre persone.</p></div>`;document.querySelectorAll('[data-response]').forEach(x=>x.onclick=()=>task(async()=>{await api('availability',{token:t,eventId:x.dataset.response,status:x.dataset.status});toast('Disponibilità salvata');await playerPage()}))}catch(e){app.innerHTML=`<div class="auth"><div class="alert">${esc(e.message)}. Chiedi al dirigente un nuovo link.</div></div>`}}
boot();
</script></body></html>
