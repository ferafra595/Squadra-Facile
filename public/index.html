function parseFixtureCSV(text){
 const raw=text.replace(/^\uFEFF/,''), first=raw.split(/\r?\n/,1)[0]||'';
 const separator=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
 const lines=[];let row=[],field='',quoted=false;
 for(let i=0;i<raw.length;i++){let c=raw[i];
  if(c==='"'){if(quoted&&raw[i+1]==='"'){field+='"';i++}else quoted=!quoted}
  else if(c===separator&&!quoted){row.push(field.trim());field=''}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&raw[i+1]==='\n')i++;row.push(field.trim());if(row.some(Boolean))lines.push(row);row=[];field=''}
  else field+=c;
 }
 if(quoted)throw Error('CSV non valido: virgolette non chiuse');
 row.push(field.trim());if(row.some(Boolean))lines.push(row);
 if(!lines.length)throw Error('CSV vuoto');
 const cols=lines.shift().map(x=>x.toLowerCase());
 const required=['giornata','avversario','data','ora','campo','casa'];
 if(required.some(x=>!cols.includes(x)))throw Error('Intestazioni CSV mancanti: '+required.join(','));
 const rows=lines.map((values,i)=>{
  const v=Object.fromEntries(cols.map((k,j)=>[k,values[j]||'']));
  let dt=v.data;if(/^\d{2}\/\d{2}\/\d{4}$/.test(dt)){let [dd,mm,yy]=dt.split('/');dt=yy+'-'+mm+'-'+dd}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||!/^\d{2}:\d{2}$/.test(v.ora)||!v.avversario)throw Error('Riga '+(i+2)+': data, ora o avversario non validi');
  const d=new Date(dt+'T'+v.ora+':00');if(Number.isNaN(d.getTime())||d.getFullYear()!==Number(dt.slice(0,4))||d.getMonth()+1!==Number(dt.slice(5,7))||d.getDate()!==Number(dt.slice(8,10)))throw Error('Riga '+(i+2)+': data impossibile');
  return {round:v.giornata,opponent:v.avversario,startsAt:dt+'T'+v.ora,venue:v.campo,home:/^(si|sì|1|casa|true)$/i.test(v.casa)};
 });
 if(!rows.length||rows.length>80)throw Error('Il file deve contenere da 1 a 80 partite');
 return rows;
}

async function submitAdminTeam(e){
 e.preventDefault();const form=e.currentTarget,submit=$('#createTeamSubmit'),error=$('#createTeamError'),f=new FormData(form);
 const name=String(f.get('name')||'').trim(),email=String(f.get('email')||'').trim(),password=String(f.get('password')||'');
 error.style.display='none';
 if(!name||password.length<10){error.textContent='Inserisci il nome e una password di almeno 10 caratteri.';error.style.display='block';return}
 submit.disabled=true;submit.textContent='Salvataggio in corso…';
 try{
  const r=await fetch('/api/admin',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'adminCreateTeam',name,email,password,format:Number(f.get('format')),plan:f.get('plan')})});
  const ct=r.headers.get('content-type')||'';const data=ct.includes('application/json')?await r.json():{error:'Il server non ha restituito JSON (HTTP '+r.status+').'};
  if(!r.ok||!data.ok||!data.team?.id)throw Error(data.error||'Creazione non confermata dal server');
  const refreshed=await get('/api/admin');
  if(!refreshed.teams.some(t=>t.id===data.team.id))throw Error('Account creato, ma la squadra non compare ancora nell’elenco. Aggiorna la pagina prima di riprovare.');
  adminData=refreshed;adminTab='teams';renderAdmin();toast('Squadra «'+name+'» creata e verificata nel database.');
 }catch(ex){error.textContent=ex.message;error.className='full alert error';error.style.display='block';toast('Impossibile creare la squadra: '+ex.message)}
 finally{submit.disabled=false;submit.textContent='Crea squadra e account'}
}

function modal(title,body,onSave,button='Salva'){
 document.querySelector('#sfModal')?.remove();let el=document.createElement('div');el.id='sfModal';el.className='sf-overlay';el.innerHTML=`<section class="sf-dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="section-head"><h2>${esc(title)}</h2><button type="button" class="btn ghost sm" id="sfClose">✕</button></div><form id="sfDialogForm" class="form">${body}<div class="sf-dialog-actions"><button type="button" class="btn ghost" id="sfCancel">Annulla</button><button class="btn" id="sfSave">${esc(button)}</button></div><div class="small error" id="sfModalError" role="alert"></div></form></section>`;document.body.appendChild(el);
 let close=()=>el.remove();el.querySelector('#sfClose').onclick=close;el.querySelector('#sfCancel').onclick=close;el.onclick=e=>{if(e.target===el)close()};el.querySelector('form').onsubmit=async e=>{e.preventDefault();let btn=el.querySelector('#sfSave');btn.disabled=true;try{await onSave(new FormData(e.target));close()}catch(ex){el.querySelector('#sfModalError').textContent=ex.message}finally{btn.disabled=false}};el.querySelector('input,select,textarea')?.focus();
}

function tacticEditor(existing=null){let format=Number(state.data.team.format),n=format,positions=existing?JSON.parse(existing.positions):Array.from({length:n},(_,i)=>({name:String(i+1),x:15+Math.round(i%4)*22,y:12+Math.floor(i/4)*30}));let phase=existing?.phase||'offense';modal(existing?'Visualizza tattica':'Nuova tattica',`<label>Nome schema</label><input name="title" required maxlength="100" value="${esc(existing?.title||'')}"><label>Modulo</label><input name="formation" required placeholder="Es. 4-3-3 / 2-3-1" value="${esc(existing?.formation||'')}"><label>Fase</label><select name="phase">${[['offense','Possesso / attacco'],['defense','Non possesso / difesa'],['transition','Transizioni'],['setpiece','Palle inattive']].map(([v,l])=>`<option value="${v}" ${v===phase?'selected':''}>${l}</option>`).join('')}</select><div class="sf-pitch" id="sfPitch"></div><p class="small muted">Trascina i giocatori sulla lavagna per definire posizioni e movimenti. Aggiungi nelle note principi, pressing, smarcamenti, transizioni e correzioni.</p><label>Analisi tattica e indicazioni</label><textarea name="notes" rows="5">${esc(existing?.notes||'')}</textarea>`,async f=>{if(existing)return;await api('saveTactic',{teamId:state.team,title:f.get('title'),formation:f.get('formation'),phase:f.get('phase'),notes:f.get('notes'),positions});await load()},existing?'Chiudi':'Salva tattica');let pitch=$('#sfPitch');positions.forEach((p,i)=>{let node=document.createElement('button');node.type='button';node.className='sf-player-dot';node.textContent=p.name;node.style.left=p.x+'%';node.style.top=p.y+'%';pitch.appendChild(node);if(existing)return;node.onpointerdown=e=>{e.preventDefault();node.setPointerCapture(e.pointerId)};node.onpointermove=e=>{if(!node.hasPointerCapture(e.pointerId))return;let r=pitch.getBoundingClientRect();p.x=Math.round(Math.max(5,Math.min(95,(e.clientX-r.left)/r.width*100)));p.y=Math.round(Math.max(5,Math.min(95,(e.clientY-r.top)/r.height*100)));node.style.left=p.x+'%';node.style.top=p.y+'%'}});
}
// Risposta da link pubblico: unica URL condivisa, scelta del nome e risposta.
const sharedEventToken=new URLSearchParams(location.search).get('event');
async function sharedEventPage(){try{let d=await get('/api/event-response?token='+encodeURIComponent(sharedEventToken));app.innerHTML=`<div class="player"><div class="brand" style="color:#14263e"><span class="logo">⚽</span> SquadraFacile</div>${card(esc(d.event.team_name),`<h2>${esc(d.event.title)}</h2><p class="muted">${esc(date(d.event.starts_at))} · ${esc(d.event.venue||'')}</p><p>Seleziona il tuo nome e conferma la disponibilità.</p><label>Il tuo nome</label><select id="respondPlayer"><option value="">Seleziona dalla rosa</option>${d.players.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}${p.status?' · risposta già presente':''}</option>`).join('')}</select><div class="sf-dialog-actions"><button class="btn" data-answer="yes">✓ Presente</button><button class="btn ghost" data-answer="maybe">In forse</button><button class="btn danger" data-answer="no">✕ Assente</button></div><p class="small muted">Chiunque abbia il link può selezionare un nome. Il dirigente può controllare le risposte.</p>`)}</div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>task(async()=>{let id=$('#respondPlayer').value;if(!id)throw Error('Seleziona prima il tuo nome');await api('eventResponse',{token:sharedEventToken,playerId:id,status:b.dataset.answer});toast('Risposta registrata');await sharedEventPage()}))}catch(e){app.innerHTML=`<div class="auth">${card('Link non disponibile',esc(e.message))}</div>`}}
if(sharedEventToken){state.playerToken=null;sharedEventPage()}

window.addEventListener('hashchange',()=>{if(state.me&&state.data&&location.hash==='#/app')render();else route()});if(!sharedEventToken)boot();
</script></body></html>
